<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="assets/Christmas_Bell.png">
    <title>Jingle Bell</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <!-- A super quick program that plays a jingle bell sound effect
    when the user clicks the bell image -->
    
    <section id="container" class="bellContainer">
        <h2>Tap the bell to make it ring!</h2>

        <div id="bellImage">
            <img src="assets/Christmas_Bell.png" alt="jingle_bell_image" id="bell" class="bellSize">
        </div>

        
    </section>
    
    <section id="container" class="btnContainer">
        <button class="websiteBtn"> 
            <a href="https://www.thebaychorale.com/"> <strong>Visit The Bay Chorale Website!</strong></a>
        </button>
    </section>

    <script>
        // Craete a variable for the audio file
        const sound = new Audio('assets/Sleigh_Bells_sfx.mp3')

        // Play the audio when the bell image is clicked
        document.getElementById("bell").addEventListener('click', ()=> {
            sound.play()
        })

    </script>
</body>
</html>
